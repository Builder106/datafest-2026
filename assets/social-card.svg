  <text x="80" y="478" font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#b3361b">1.94<tspan fill="#6b6f76" font-size="38" font-weight="600" dx="14">vs 0.48</tspan></text>
